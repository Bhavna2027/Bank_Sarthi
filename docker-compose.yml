version: '3.9'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: banksarthi
      POSTGRES_USER: banksarthi
      POSTGRES_PASSWORD: banksarthi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://banksarthi:banksarthi@postgres:5432/banksarthi
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
