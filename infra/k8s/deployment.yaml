apiVersion: apps/v1
kind: Deployment
metadata:
  name: banksarthi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banksarthi-backend
  template:
    metadata:
      labels:
        app: banksarthi-backend
    spec:
      containers:
        - name: backend
          image: banksarthi/backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: banksarthi-backend
spec:
  selector:
    app: banksarthi-backend
  ports:
    - port: 80
      targetPort: 8000
